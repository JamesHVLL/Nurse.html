<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #0284c7;

            --error: #dc2626;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            margin: 1rem;
            max-height: 90vh;
            overflow-y: auto;
        }

        h1, h2 {
            color: var(--primary-dark);
            text-align: center;
            margin-top: 0;
        }

        p {
            color: var(--text-light);
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #64748b;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .option-btn {
            background-color: #f1f5f9;
            color: var(--text);
            border: 1px solid #cbd5e1;
            text-align: left;
        }

        .option-btn:hover {
            background-color: #e2e8f0;
        }

        .option-btn.correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
        }

        .option-btn.incorrect {
            background-color: var(--error) !important;
            color: white;
            border-color: var(--error);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .stats-box {
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
        }

        .feedback-text {
            font-weight: bold;
            text-align: center;
            margin: 1rem 0;
            min-height: 1.5rem;
        }

        .progress-bar {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 1rem;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="main-menu" class="screen active">
        <h1>🩺 NCLEX Master Trivia (9 Systems)</h1>
        <p>Comprehensive clinical reasoning questions across all 9 core medical-surgical systems.</p>
        <button class="btn" onclick="startTestKnowledgeMode()">Test Knowledge Mode (All Systems)</button>
        <button class="btn btn-secondary" onclick="showCategoryMenu()">Choose Category Mode</button>
    </div>

    <div id="category-menu" class="screen">
        <h2>Select a System</h2>
        <div class="category-grid" id="category-buttons">
            </div>
        <button class="btn btn-secondary" style="margin-top: 1rem;" onclick="showScreen('main-menu')">Back to Main Menu</button>
    </div>

    <div id="quiz-screen" class="screen">

        <div id="options-container">
            </div>
        <div class="feedback-text" id="feedback-display"></div>

        <div class="stats-box" id="results-stats">
            </div>
        <button class="btn" onclick="showScreen('main-menu')">Return to Main Menu</button>
    </div>

</div>

                { text: "Unstageable Pressure Injury", correct: false }
            ] 
        },
        { 
            category: "Integumentary & Sensory System", 
            question: "What clinical presentation is characteristic of acute angle-closure glaucoma, representing an ocular emergency?", 
            options: [
                { text: "Sudden severe eye pain, blurred vision, colored halos around lights, and a fixed mid-dilated pupil", correct: true },
                { text: "Gradual loss of peripheral vision with painless tunnel vision development", correct: false },
                { text: "Painless cloudy vision with progressive glare sensitivity over years", correct: false },
                { text: "Bilateral purulent discharge with intense itching and morning crusting", correct: false }
            ] 
        },
        { 
            category: "Integumentary & Sensory System", 
            question: "Which instruction should be provided to a patient following cataract extraction surgery?", 
            options: [
                { text: "Avoid bending at the waist, heavy lifting, or straining to prevent intraocular pressure spikes", correct: true },
                { text: "Sleep flat on the operative side to promote proper drainage of the eye", correct: false },
                { text: "Scrub the operative eye vigorously with soap and water twice daily", correct: false },
                { text: "Resume heavy contact sports immediately once the eye patch is removed", correct: false }
            ] 
        },
        { 
            category: "Integumentary & Sensory System", 
            question: "What is a primary clinical manifestation associated with Meniere's disease?", 
            options: [
                { text: "Episodic vertigo, tinnitus, fluctuating sensorineural hearing loss, and a feeling of fullness in the ear", correct: true },
                { text: "Chronic painless drainage from the external auditory canal", correct: false },
                { text: "Sudden conductive hearing loss triggered by loud environmental noises", correct: false },
                { text: "Severe sharp pain radiating from the jaw to the middle ear structure", correct: false }
            ] 
        }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let categoryStats = {};

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startTestKnowledgeMode() {
        currentQuestions = shuffleArray([...questionBank]);
        initQuiz();
    }

    function showCategoryMenu() {
        const categories = [...new Set(questionBank.map(q => q.category))];
        const grid = document.getElementById("category-buttons");
        grid.innerHTML = "";
        
        categories.forEach(cat => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.textContent = cat;
            btn.onclick = () => startCategoryMode(cat);
            grid.appendChild(btn);
        });

        showScreen("category-menu");
    }

    function startCategoryMode(category) {
        currentQuestions = shuffleArray(questionBank.filter(q => q.category === category));
        initQuiz();
    }

    function initQuiz() {
        currentIndex = 0;
        score = 0;
        categoryStats = {};
        showScreen("quiz-screen");
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            showResults();
            return;
        }

        const q = currentQuestions[currentIndex];
        document.getElementById("progress-indicator").textContent = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
        document.getElementById("question-text").textContent = q.question;
        document.getElementById("feedback-display").textContent = "";
        document.getElementById("next-btn").style.display = "none";

        const container = document.getElementById("options-container");
        container.innerHTML = "";

        let shuffledOptions = shuffleArray([...q.options]);

        shuffledOptions.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "btn option-btn";
            btn.textContent = opt.text;
            btn.onclick = () => selectOption(opt.correct, btn, shuffledOptions);
            container.appendChild(btn);
        });
    }

    function selectOption(isCorrect, selectedBtn, allOptions) {
        const container = document.getElementById("options-container");
        const buttons = container.getElementsByTagName("button");
        
        for (let btn of buttons) {
            btn.disabled = true;
            const matchingOpt = allOptions.find(o => o.text === btn.textContent);
            if (matchingOpt && matchingOpt.correct) {
                btn.classList.add("correct");
            }
        }

        const feedback = document.getElementById("feedback-display");
        const q = currentQuestions[currentIndex];

        if (!categoryStats[q.category]) {
            categoryStats[q.category] = { total: 0, correct: 0 };
        }
        categoryStats[q.category].total++;

        if (isCorrect) {
            selectedBtn.classList.add("correct");
            feedback.style.color = "var(--success)";
            feedback.textContent = "Correct! Great clinical reasoning.";
            score++;
            categoryStats[q.category].correct++;
        } else {
            selectedBtn.classList.add("incorrect");
            feedback.style.color = "var(--error)";
            feedback.textContent = "Incorrect. Review the highlighted correct choice above.";
        }

        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    function showResults() {
        showScreen("results-screen");
        const statsBox = document.getElementById("results-stats");
        let html = `<h3>Total Score: ${score} / ${currentQuestions.length}</h3>`;
        
        for (let cat in categoryStats) {
            let stat = categoryStats[cat];
            let percent = Math.round((stat.correct / stat.total) * 100);
            html += `<p><strong>${cat}:</strong> ${stat.correct}/${stat.total} (${percent}%)</p>`;
        }
        
        statsBox.innerHTML = html;
    }
</script>

</body>
</html>
