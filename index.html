<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nursing Student NCLEX Prep Trivia - Master Edition</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --success: #16a34a;
            --error: #dc2626;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            margin: 1rem;
            max-height: 90vh;
            overflow-y: auto;
        }

        h1, h2 {
            color: var(--primary-dark);
            text-align: center;
            margin-top: 0;
        }

        p {
            color: var(--text-light);
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #64748b;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .option-btn {
            background-color: #f1f5f9;
            color: var(--text);
            border: 1px solid #cbd5e1;
            text-align: left;
        }

        .option-btn:hover {
            background-color: #e2e8f0;
        }

        .option-btn.correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
        }

        .option-btn.incorrect {
            background-color: var(--error) !important;
            color: white;
            border-color: var(--error);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .stats-box {
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
        }

        .feedback-text {
            font-weight: bold;
            text-align: center;
            margin: 1rem 0;
            min-height: 1.5rem;
        }

        .progress-bar {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 1rem;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- MAIN MENU SCREEN -->
    <div id="main-menu" class="screen active">
        <h1>🩺 Nursing Study Trivia (Expanded 450+ Qs)</h1>
        <p>Master your clinical reasoning for NCLEX and exams across all 9 core systems.</p>
        <button class="btn" onclick="startTestKnowledgeMode()">Test Knowledge Mode (All Systems)</button>
        <button class="btn btn-secondary" onclick="showCategoryMenu()">Choose Category Mode</button>
    </div>

    <!-- CATEGORY SELECTION SCREEN -->
    <div id="category-menu" class="screen">
        <h2>Select a System</h2>
        <div class="category-grid" id="category-buttons">
            <!-- Dynamically populated via JS -->
        </div>
        <button class="btn btn-secondary" style="margin-top: 1rem;" onclick="showScreen('main-menu')">Back to Main Menu</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="screen">
        <div class="progress-bar" id="progress-indicator">Question 1 of 50</div>
        <h3 id="question-text">Question goes here?</h3>
        <div id="options-container">
            <!-- Options dynamically populated -->
        </div>
        <div class="feedback-text" id="feedback-display"></div>
        <button class="btn" id="next-btn" style="display:none;" onclick="nextQuestion()">Next Question</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="results-screen" class="screen">
        <h2>Quiz Complete! 🎉</h2>
        <div class="stats-box" id="results-stats">
            <!-- Stats populated here -->
        </div>
        <button class="btn" onclick="showScreen('main-menu')">Return to Main Menu</button>
    </div>

</div>

        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is multiple myeloma?", options: ["Malignant proliferation of plasma cells in bone marrow producing abnormal monoclonal immunoglobulins (Bence-Jones proteins) and bone destruction", "Lymph node cancer with Reed-Sternberg cells", "Leukemia of white blood cells", "Benign bone tumor"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What lab and diagnostic findings are classic for multiple myeloma?", options: ["Hypercalcemia, bone lesions ('punched-out' lytic lesions), Bence-Jones protein in urine, and elevated serum protein", "Hypocalcemia and dense bone sclerosis", "Low protein and normal calcium", "Decreased serum creatinine"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is the nurse's immediate action if a patient receiving a blood transfusion develops fever, chills, back pain, and hypotension?", options: ["Stop the blood transfusion immediately, disconnect tubing, infuse normal saline through new tubing, and notify the blood bank and physician", "Slow the transfusion rate down and give Tylenol", "Continue transfusion while monitoring vital signs", "Administer high-flow oxygen only"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What type of reaction is a hemolytic transfusion reaction?", options: ["Type II cytotoxic hypersensitivity reaction", "Type I immediate allergy", "Type III immune complex", "Type IV delayed cell-mediated"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "Within what timeframe must a unit of packed red blood cells be infused once removed from the blood bank refrigerator?", options: ["Within 15 minutes", "Within 4 hours", "Within 12 hours", "Within 24 hours"], answer: 1 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What gauge IV catheter is generally recommended for administering blood products safely without hemolysis?", options: ["14 to 16 gauge", "18 to 20 gauge (or larger)", "24 gauge", "Micro-bore catheter"], answer: 1 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "Which IV solution is compatible and can be hung with blood products?", options: ["0.9% Sodium Chloride (Normal Saline)", "5% Dextrose in Water (D5W)", "Lactated Ringer's", "0.45% Sodium Chloride"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is systemic lupus erythematosus (SLE)?", options: ["Chronic multisystem inflammatory autoimmune disease characterized by autoantibody production (e.g., ANA) and classic butterfly facial rash", "Localized skin fungal infection", "Degenerative joint disease", "Acute bacterial sepsis"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is rheumatoid arthritis classified as?", options: ["Systemic autoimmune inflammatory disease targeting synovial joints", "Degenerative wear-and-tear arthritis", "Infectious joint disease", "Metabolic crystal arthritis"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is human immunodeficiency virus (HIV) primary cellular target?", options: ["CD4+ T-helper lymphocytes", "Red blood cells", "Platelets", "B-lymphocytes"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "At what CD4+ T-lymphocyte count does HIV progress to Acquired Immunodeficiency Syndrome (AIDS) according to CDC criteria?", options: ["Below 200 cells/mm³ (or presence of an AIDS-defining illness)", "Below 500 cells/mm³", "Below 1000 cells/mm³", "Any positive antibody test"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What precautions are required for healthcare workers dealing with body fluids to prevent HIV transmission?", options: ["Standard precautions (wearing gloves, gowns, eye protection when risk of splash)", "Strict airborne isolation", "Droplet isolation", "No precautions needed"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is natural active immunity?", options: ["Immunity developed following exposure to an infectious agent and recovery from the disease", "Immunity conferred by receiving immune globulin injections", "Antibodies passed from mother to baby via placenta", "Vaccination"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is artificial active immunity?", options: ["Immunity acquired through vaccination (introducing antigen to stimulate immune response)", "Getting infected naturally", "Receiving donor antibodies", "Placental antibody transfer"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is natural passive immunity?", options: ["Antibodies passed naturally from mother to infant via placenta and breast milk", "Receiving an antivenom injection", "Tetnus vaccine", "Active disease recovery"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is artificial passive immunity?", options: ["Administration of preformed antibodies (immune globulin or antitoxin) for immediate temporary protection", "Vaccine administration", "Natural infection", "Breastfeeding"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is the function of the spleen in the hematologic and lymphatic systems?", options: ["Filter blood, remove old/damaged red blood cells, store platelets, and mount immune responses", "Produce digestive enzymes", "Filter lymph fluid from legs", "Produce insulin"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is lymphadenopathy?", options: ["Enlargement of lymph nodes, often indicating infection, inflammation, or malignancy", "Swelling of the spleen", "Low white blood cell count", "Inflammation of blood vessels"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is lymphedema?", options: ["Localized fluid retention and tissue swelling caused by compromised lymphatic drainage (e.g., after lymph node dissection)", "Blood clot in veins", "Fatty tissue buildup", "Ascites in abdomen"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is the primary role of neutrophils in the immune response?", options: ["Phagocytosis of bacteria during acute inflammatory and infectious processes", "Produce antibodies", "Destroy parasite infections", "Mediate allergic reactions"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "Which white blood cells are elevated primarily during parasitic infections and allergic reactions?", options: ["Eosinophils", "Neutrophils", "Lymphocytes", "Monocytes"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "Which white blood cells release histamine and heparin during inflammatory and allergic responses?", options: ["Basophils and mast cells", "Neutrophils", "Platelets", "Erythrocytes"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is the universal red blood cell donor type (packed RBCs)?", options: ["Type O negative", "Type AB positive", "Type A positive", "Type B negative"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is the universal plasma donor type?", options: ["Type AB", "Type O", "Type A", "Type B"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is erythroblastosis fetalis (hemolytic disease of the newborn)?", options: ["Rh incompatibility where Rh-negative mother develops antibodies against Rh-positive fetus's red blood cells", "Iron deficiency in newborns", "WBC cancer in infants", "Platelet destruction"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What medication is administered to Rh-negative mothers to prevent sensitization and hemolytic disease of the newborn?", options: ["Rho(D) immune globulin (RhoGAM)", "Vitamin K", "Heparin", "Aspirin"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is the primary function of platelets (thrombocytes)?", options: ["Hemostasis and blood clotting by forming platelet plugs at sites of vascular injury", "Fight bacterial infections", "Carry oxygen to tissues", "Produce antibodies"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is neutropenic precaution (protective isolation)?", options: ["Specialized precautions for immunocompromised patients with low ANC to prevent opportunistic infection (private room, strict handwashing, no fresh flowers/fruits/vegetables)", "Airborne isolation for tuberculosis", "Contact precautions for C. diff", "Standard precautions only"], answer: 0 },
        { category: "Immune, Hematologic, and Lymphatic Systems", question: "What is immunocompetence?", options: ["The body's ability to produce a normal immune response following exposure to an antigen", "Failure of the immune system", "Autoimmune destruction", "Allergic hypersensitivity"], answer: 0 }
    ];

    let currentMode = ''; // 'test' or 'category'
    let activeQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let missedCategories = {}; // Tracks misses for Test Knowledge mode

    // Initialize Category Menu buttons
    function initCategoryMenu() {
        const categories = [...new Set(questionBank.map(q => q.category))];
        const container = document.getElementById('category-buttons');
        container.innerHTML = '';
        
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'btn option-btn';
            btn.textContent = cat;
            btn.onclick = () => startCategoryMode(cat);
            container.appendChild(btn);
        });
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        document.querySelector('.container').scrollTop = 0;
    }

    function showCategoryMenu() {
        initCategoryMenu();
        showScreen('category-menu');
    }

    function startTestKnowledgeMode() {
        currentMode = 'test';
        // Pick 50 random questions across all categories for Test Mode
        activeQuestions = [...questionBank].sort(() => 0.5 - Math.random()).slice(0, 50);
        currentIndex = 0;
        score = 0;
        missedCategories = {};
        showScreen('quiz-screen');
        loadQuestion();
    }

    function startCategoryMode(categoryName) {
        currentMode = 'category';
        // Filter all questions for this category (50 questions available)
        activeQuestions = questionBank.filter(q => q.category === categoryName);
        currentIndex = 0;
        score = 0;
        showScreen('quiz-screen');
        loadQuestion();
    }

    function loadQuestion() {
        const q = activeQuestions[currentIndex];
        document.getElementById('progress-indicator').textContent = `Question ${currentIndex + 1} of ${activeQuestions.length} (${q.category})`;
        document.getElementById('question-text').textContent = q.question;
        document.getElementById('feedback-display').textContent = '';
        document.getElementById('next-btn').style.display = 'none';

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn option-btn';
            btn.textContent = opt;
            btn.onclick = () => selectAnswer(index);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(selectedIndex) {
        const q = activeQuestions[currentIndex];
        const optionButtons = document.querySelectorAll('#options-container .option-btn');
        
        // Disable all option buttons after choice
        optionButtons.forEach(btn => btn.onclick = null);

        const feedback = document.getElementById('feedback-display');

        if (selectedIndex === q.answer) {
            optionButtons[selectedIndex].classList.add('correct');
            score++;
            if (currentMode === 'category') {
                feedback.style.color = "var(--success)";
                feedback.textContent = "Correct! Excellent job keeping your clinical judgment sharp.";
            }
        } else {
            optionButtons[selectedIndex].classList.add('incorrect');
            optionButtons[q.answer].classList.add('correct'); // Reveal right answer
            
            if (currentMode === 'category') {
                feedback.style.color = "var(--error)";
                feedback.textContent = `Incorrect. The correct answer is: ${q.options[q.answer]}`;
            } else {
                // Track areas of improvement for Test Mode
                missedCategories[q.category] = (missedCategories[q.category] || 0) + 1;
            }
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < activeQuestions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        showScreen('results-screen');
        const statsBox = document.getElementById('results-stats');
        let html = `<p>You scored <strong>${score}</strong> out of <strong>${activeQuestions.length}</strong>.</p>`;

        if (currentMode === 'test') {
            const missedKeys = Object.keys(missedCategories);
            if (missedKeys.length > 0) {
                html += `<p style="text-align: left; color: var(--text); margin-top: 1rem;"><strong>Areas where you need more review:</strong></p><ul style="text-align: left; color: var(--text-light); padding-left: 1.5rem;">`;
                for (let cat of missedKeys) {
                    html += `<li>${cat}: ${missedCategories[cat]} missed question(s)</li>`;
                }
                html += `</ul>`;
            } else {
                html += `<p style="color: var(--success); font-weight: bold;">Flawless performance across all systems! Outstanding mastery.</p>`;
            }
        }

        statsBox.innerHTML = html;
    }
</script>
